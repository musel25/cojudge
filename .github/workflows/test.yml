name: Verify Application and Problems

on:
  push:
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check types and Svelte components
        run: npm run check

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build application and run browser tests
        run: npm run test:e2e

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

      - name: Pull Java runtime image
        run: docker pull alpine/java:22-jdk

      - name: Verify problems
        run: npm run verify:problems
