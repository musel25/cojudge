server {
    listen 80;
    listen [::]:80;
    server_name cojudge.musel.dev;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cojudge.musel.dev;
    ssl_certificate /etc/letsencrypt/live/cojudge.musel.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cojudge.musel.dev/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 5m;

    location = /_cojudge_login_check {
        internal;
        proxy_pass http://127.0.0.1:5380/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    location / {
        auth_request /_cojudge_login_check;
        auth_request_set $cojudge_login_user $upstream_http_x_cojudge_user;
        auth_request_set $cojudge_login_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $cojudge_login_cookie always;
        # Location add_header directives replace inherited headers.
        add_header Strict-Transport-Security "max-age=31536000" always;

        proxy_pass http://127.0.0.1:5379;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-CoJudge-User $cojudge_login_user;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
